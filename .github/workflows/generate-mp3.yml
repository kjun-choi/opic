name: Generate OPIc MP3

on:
  push:
    branches:
      - main
    paths:
      - "scripts/*.md"
      - "tools/make_mp3.py"
      - ".github/workflows/generate-mp3.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "변환 모드 (normal 또는 shadowing)"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - shadowing
      rate:
        description: "말하기 속도 (예: +0%, -10%)"
        required: false
        default: "+0%"
        type: string

permissions:
  contents: write

jobs:
  build-mp3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install --upgrade edge-tts

      - name: Generate MP3 files
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          RATE="${{ github.event.inputs.rate || '+0%' }}"
          if [ "$MODE" = "shadowing" ]; then
            python -u tools/make_mp3.py --mode shadowing --pause 2.5 --rate="$RATE" --out mp3
          else
            python -u tools/make_mp3.py --mode normal --rate="$RATE" --out mp3
          fi

      - name: Upload MP3 bundle as Artifact (for mobile download)
        uses: actions/upload-artifact@v4
        with:
          name: opic-mp3-bundle
          path: mp3/
          retention-days: 30

      - name: Commit updated MP3 & player back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mp3/
          if git diff --cached --quiet; then
            echo "변경된 MP3 파일이 없습니다."
          else
            git commit -m "chore: update OPIc MP3 audio files [skip ci]"
            git push
          fi
